{% load static %}<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/app.css' %}">
</head>
<body>
{% block body %}
  <header class="topbar">
    <a class="brand" href="{% url 'core:home' %}">TWIN<b>EMA</b></a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'core:logout' %}">{% csrf_token %}
        <button class="btn ghost" type="submit">Wyloguj ({{ user.get_username }})</button>
      </form>
    {% endif %}
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
{% endblock %}
</body>
</html>
