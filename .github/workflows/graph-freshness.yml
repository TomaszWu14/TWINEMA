# Watchdog świeżości grafu wiedzy (graphify-out/).
#
# Graf jest generowany LOKALNIE narzędziem graphify (brak binarki w CI — regeneracja
# tutaj jest niewykonalna), więc CI pilnuje tylko KADENCJI: gdy graphify-out/ odstaje
# od main, otwiera issue z etykietą `graf-wiedzy` i instrukcją odświeżenia.
# Przy już otwartym issue nie duplikuje. Szczegóły: README „Git hooks i graf wiedzy”.
name: Graph freshness

on:
  schedule:
    - cron: "0 6 * * 1"   # poniedziałki 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # pełna historia — liczymy commity od ostatniej regeneracji

      - name: Zmierz dryf grafu względem main
        id: drift
        run: |
          set -euo pipefail
          last_commit=$(git log -1 --format=%H -- graphify-out/)
          last_epoch=$(git log -1 --format=%ct -- graphify-out/)
          commits_behind=$(git rev-list --count "${last_commit}..HEAD")
          days_old=$(( ( $(date +%s) - last_epoch ) / 86400 ))
          built_from=$(sed -n 's/.*Built from commit: `\([0-9a-f]*\)`.*/\1/p' graphify-out/GRAPH_REPORT.md | head -1)
          {
            echo "commits_behind=${commits_behind}"
            echo "days_old=${days_old}"
            echo "built_from=${built_from:-nieznany}"
          } >> "$GITHUB_OUTPUT"
          # Nieświeży: ≥30 commitów za main ALBO ≥7 dni i ≥5 commitów.
          if [ "${commits_behind}" -ge 30 ] || { [ "${days_old}" -ge 7 ] && [ "${commits_behind}" -ge 5 ]; }; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
          echo "graphify-out: ${commits_behind} commitów za HEAD, ${days_old} dni od regeneracji"

      - name: Otwórz issue przypominające (gdy graf nieświeży)
        if: steps.drift.outputs.stale == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const label = 'graf-wiedzy';
            const { owner, repo } = context.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: '8b5cf6',
                description: 'Świeżość grafu wiedzy (graphify / Obsidian)',
              });
            }

            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open' });
            if (open.data.length) {
              core.info(`Issue już otwarte: #${open.data[0].number} — nie duplikuję.`);
              return;
            }

            const d = ${{ toJSON(steps.drift.outputs) }};
            const body = [
              'Graf wiedzy w `graphify-out/` odstaje od `main`:',
              '',
              `- commitów od ostatniej regeneracji: **${d.commits_behind}**`,
              `- dni od ostatniej regeneracji: **${d.days_old}**`,
              `- graf zbudowany z commita: \`${d.built_from}\``,
              '',
              'Jak odświeżyć (na maszynie z graphify — narzędzie nie jest dostępne w CI):',
              '',
              '1. `git pull` na `main`',
              '2. `graphify update .` — aktualizacja przyrostowa, bez kosztu API (patrz `graphify-out/GRAPH_REPORT.md`)',
              '3. zacommituj zmienione `graphify-out/` i wypchnij (PR)',
              '4. sync wiki do Obsidiana: `bash .githooks/pre-push` (albo hook — patrz README „Git hooks i graf wiedzy”)',
              '',
              '_Issue utworzone automatycznie przez `graph-freshness.yml` (poniedziałki 06:00 UTC); przy otwartym issue kolejne uruchomienia nie duplikują._',
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner, repo, labels: [label],
              title: 'Odśwież graf wiedzy — graphify-out/ odstaje od main',
              body,
            });
            core.info(`Utworzono issue #${issue.data.number}.`);
